name: HotDice CodeQL config

# NOTE: `paths-ignore` does NOT filter results for compiled languages, and C# is one — GitHub
# applies these filters only to interpreted languages. The entries below are therefore documentation
# of intent, not an active filter: the Farkle → HotDice rename regenerated every file under both
# paths and CodeQL promptly raised style findings (useless upcast, missing doc-comment) on them,
# despite this list and despite the files carrying `// <auto-generated/>` headers.
#
# They are kept because they still describe which directories are machine-written, and because the
# filters do apply if a future job ever analyses an interpreted language here.
#   - HotDice.ApiClient  — Kiota HTTP client (see docs/api-client-generation.md)
#   - Internal/Generated — JasperFx/Wolverine pre-generated handlers + endpoints (#305)
paths-ignore:
  - src/HotDice.ApiClient
  - src/WebApp/Internal/Generated

# Deliberately NOT adding `query-filters` to suppress the rules those generated files trip
# (cs/useless-upcast, the doc-comment rules). Those filters are repo-wide, and the same
# `cs/useless-upcast` rule caught a genuine one in hand-written test code in this very PR. Silencing
# a rule everywhere to quieten generated code would have hidden it.
#
# Generated-code findings are expected to appear when those files are regenerated. Dismiss them in
# the Security tab as "won't fix — generated code"; do not hand-edit generated files to appease a
# style rule, because the next regeneration reverts the edit.
