name: Setup MAUI toolchain
description: >
  Shared toolchain setup for the HotDice device builds (#338) — the GitHub analogue of the reference
  app's setup.yml ADO template. Pins the .NET SDK from global.json, installs the requested MAUI
  workload, and (on macOS) pins Xcode explicitly rather than trusting the runner default.

inputs:
  workload:
    description: 'MAUI workload to install: android or ios.'
    required: true
  xcode-version:
    description: 'Xcode version to select on macOS runners (e.g. 16.2). Ignored on non-macOS.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup .NET (SDK pinned by global.json)
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Xcode is pinned before the workload install so maui-ios resolves against the intended SDK.
    # Reference-app lesson: select Xcode in the workflow — never rely on the image default, which
    # drifts and silently changes the iOS SDK you build against.
    - name: Pin Xcode (macOS only)
      if: runner.os == 'macOS' && inputs.xcode-version != ''
      shell: bash
      run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer"

    - name: Install MAUI workload (maui-${{ inputs.workload }})
      shell: bash
      run: dotnet workload install "maui-${{ inputs.workload }}"
