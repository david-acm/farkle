name: E2E Happy-Path Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore tests/Farkle.E2eTests/Farkle.E2eTests.csproj

      - name: Clean
        run: dotnet clean tests/Farkle.E2eTests/Farkle.E2eTests.csproj

      - name: Build
        run: dotnet build tests/Farkle.E2eTests/Farkle.E2eTests.csproj --no-restore

      - name: Install Playwright Chromium
        # Use the playwright.ps1 bundled with the build output — it matches the exact
        # Microsoft.Playwright NuGet version so browsers are installed to the right path.
        run: pwsh tests/Farkle.E2eTests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run happy-path e2e tests
        run: >
          dotnet test tests/Farkle.E2eTests/Farkle.E2eTests.csproj
          --no-build
          --filter "FullyQualifiedName~GameHappyPath"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory test-results

      - name: Print failure details
        if: failure()
        run: |
          echo "=== dotnet test output above ==="
          if [ -f test-results/e2e-results.trx ]; then
            echo "=== Full TRX ==="
            cat test-results/e2e-results.trx
          else
            echo "No TRX file found in test-results/"
            ls -la test-results/ 2>/dev/null || true
          fi

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-${{ github.run_id }}
          path: test-results/videos/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trx-${{ github.run_id }}
          path: test-results/e2e-results.trx
          if-no-files-found: warn

      - name: Extract failure details from TRX
        if: always() && github.event_name == 'pull_request'
        id: trx
        run: |
          if [ -f test-results/e2e-results.trx ]; then
            DETAILS=$(python3 -c "
import xml.etree.ElementTree as ET
tree = ET.parse('test-results/e2e-results.trx')
root = tree.getroot()
ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
lines = []
for r in root.findall('.//t:UnitTestResult', ns):
    if r.get('outcome') == 'Failed':
        name = r.get('testName', '?').split('.')[-1]
        msg_el = r.find('.//t:Message', ns)
        msg = (msg_el.text or '(no message)') if msg_el is not None else '(no message)'
        msg = msg.strip().replace('\n', ' ').replace('\r', '')[:500]
        lines.append(f'- **{name}**: \`{msg}\`')
print('\n'.join(lines) if lines else '_(no failures found in TRX)_')
" 2>/dev/null || echo "_(could not parse TRX)_")
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo "$DETAILS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "details=_(no TRX file found)_" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR with video links
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome = '${{ job.status }}' === 'success' ? '✅ passed' : '❌ failed';
            const failures = `${{ steps.trx.outputs.details }}`;
            const failureSection = '${{ job.status }}' !== 'success' && failures
              ? `\n**Failures:**\n${failures}\n`
              : '';
            const body = [
              `## E2E Happy-Path Tests ${outcome}`,
              '',
              `**Videos** (download from the run artifacts):`,
              `- [e2e-videos-${context.runId}](${runUrl}#artifacts)`,
              '',
              `| Recording | Description |`,
              `|-----------|-------------|`,
              `| \`ShowDiceAfterRolling.webm\` | Roll button clicked, dice appear |`,
              `| \`CanDragDieToSetAsideZone.webm\` | Die dragged from Rolled → SetAside zone |`,
              `| \`ScoreIncreasesAfterKeepingAScoringDie.webm\` | Full keep cycle, score updates |`,
              `| \`TurnScoreDisplayIsVisible.webm\` | Score heading visible after WASM hydration |`,
              failureSection,
              `[View full run](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
