name: CI - Tests

on:
  pull_request:
    branches: [main]
    # App-behaviour CI only — skip for infra/docs-only PRs (those run infra-validate).
    paths:
      - 'src/**'
      - 'tests/**'
      - 'HotDice.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.config/dotnet-tools.json'
      - '.github/workflows/e2e-happy-path.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history: the new-code coverage gate diffs this branch against the PR's base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HotDice.sln

      - name: Build
        run: dotnet build HotDice.sln --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/HotDice.Tests/HotDice.Tests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory test-results

      - name: Architecture tests
        run: >
          dotnet test tests/HotDice.ArchitectureTests/HotDice.ArchitectureTests.csproj
          --no-build
          --logger "trx;LogFileName=architecture-results.trx"
          --results-directory test-results

      - name: Pull Docker images for integration tests
        run: |
          docker pull postgres:16-alpine

      - name: Integration tests
        run: >
          dotnet test tests/HotDice.WebTests/HotDice.WebTests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory test-results

      - name: SPA component tests
        run: >
          dotnet test tests/HotDice.SpaTests/HotDice.SpaTests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=spa-results.trx"
          --results-directory test-results

      - name: Dice library tests
        run: >
          dotnet test tests/Blazor.Dice.Tests/Blazor.Dice.Tests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=dice-results.trx"
          --results-directory test-results

      # Shared client core (realtime lifecycle + API client). Runs on this plain Linux runner with
      # no MAUI workload, no emulator and no device — that is the point of the boundary in ADR 0010.
      - name: Client core tests
        run: >
          dotnet test tests/HotDice.Client.Tests/HotDice.Client.Tests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=client-results.trx"
          --results-directory test-results

      # New-code coverage gate: every line this PR adds or changes, in a file the suites above
      # actually cover, must be tested. Files absent from every report (the MAUI shell, generated
      # code) are out of scope by construction — the gate never blocks what it could not measure.
      - name: New-code coverage gate (100%)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          TARGET="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
          bash tests/scripts/diff-coverage.sh "origin/${TARGET}" test-results 100 coverage-diff.md

      - name: Coverage gate summary
        if: always() && github.event_name == 'pull_request'
        run: '[ -f coverage-diff.md ] && cat coverage-diff.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: HTML coverage report
        if: always()
        run: bash tests/scripts/coverage-html.sh test-results coverage-html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ github.run_id }}
          path: coverage-html
          if-no-files-found: warn

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-trx-${{ github.run_id }}
          path: test-results/*.trx
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: test-results/**/coverage.cobertura.xml
          flags: unittests
          fail_ci_if_error: false

  verify-generated:
    name: Verify generated files are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # #303 — the OpenAPI document is now emitted by booting the host (GetDocument), which needs a
    # reachable Postgres for Marten + Identity. NSwag's DB-free extraction is gone.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farkle
          POSTGRES_PASSWORD: farkle
          POSTGRES_DB: farkle_gen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore src/WebApp/WebApp.csproj

      - name: Regenerate swagger.json
        env:
          ConnectionStrings__Identity: "Host=localhost;Port=5432;Database=farkle_gen;Username=farkle;Password=farkle"
        run: dotnet build src/WebApp/WebApp.csproj --no-restore -p:GenerateSwagger=true

      - name: Install Kiota (pinned via tool manifest)
        run: dotnet tool restore

      - name: Regenerate Kiota client
        working-directory: src/HotDice.ApiClient
        # Clean-regenerate so a removed path/schema can't leave an orphan file behind.
        run: >
          rm -rf Api Models &&
          dotnet kiota generate -l CSharp
          -d ../WebApp.Client/swagger.json
          -c HotDiceApiClient
          -n HotDice.ApiClient
          -o .

      - name: Fail if generated files differ from committed
        run: |
          if ! git diff --exit-code -- src/WebApp.Client/swagger.json src/HotDice.ApiClient/; then
            echo "::error::swagger.json or HotDice.ApiClient/ are out of sync with the source."
            echo "::error::Run the generation commands documented in CLAUDE.md and commit the result."
            exit 1
          fi

  # #305 — Production runs on committed, pre-generated Wolverine handler/endpoint code
  # (TypeLoadMode.Static) for a fast cold start. This job is the codegen analogue of verify-generated:
  # regenerate the JasperFx code and fail if it drifts from what's committed. `codegen write` runs in
  # the NSwag environment (--no-launch-profile) so it skips the Identity migrate + static-asset manifest
  # and needs no database.
  verify-codegen:
    name: Verify JasperFx codegen is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore src/WebApp/WebApp.csproj

      - name: Regenerate JasperFx codegen
        env:
          ASPNETCORE_ENVIRONMENT: NSwag
          Auth__JwtSecret: "ci-codegen-signing-key-0123456789abcdef"
        run: dotnet run --project src/WebApp/WebApp.csproj --no-launch-profile -- codegen write

      - name: Fail if generated code differs from committed
        run: |
          if ! git diff --exit-code -- src/WebApp/Internal/Generated; then
            echo "::error::src/WebApp/Internal/Generated is out of sync with the source."
            echo "::error::Run 'dotnet run --project src/WebApp -- codegen write' and commit the result."
            exit 1
          fi

  docker-build:
    name: Validate WebApp Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Build the production image the same way CI - Image does (BuildKit, context = repo root) but with
      # NO push and NO Azure — so Dockerfile drift fails the PR instead of only surfacing on the
      # push-to-main CI - Image build. A stale per-project COPY line after a project rename/merge (the
      # HotDice.Shared merge, #322) broke CI - Image post-merge precisely because PRs never built the image.
      - name: docker build (no push)
        run: docker build -f src/WebApp/Dockerfile -t farkle-webapp:pr-validate .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      pull-requests: write
    outputs:
      fail_names: ${{ steps.trx.outputs.names }}
      fail_msgs: ${{ steps.trx.outputs.msgs }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore tests/HotDice.E2eTests/HotDice.E2eTests.csproj

      - name: Clean
        run: dotnet clean tests/HotDice.E2eTests/HotDice.E2eTests.csproj

      - name: Build
        run: dotnet build tests/HotDice.E2eTests/HotDice.E2eTests.csproj --no-restore

      - name: Install Playwright Chromium
        # Use the playwright.ps1 bundled with the build output — it matches the exact
        # Microsoft.Playwright NuGet version so browsers are installed to the right path.
        run: pwsh tests/HotDice.E2eTests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run happy-path e2e tests
        run: >
          dotnet test tests/HotDice.E2eTests/HotDice.E2eTests.csproj
          --no-build
          --filter "FullyQualifiedName~GameHappyPath"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory test-results

      - name: List test-results files
        if: always()
        run: find test-results -type f 2>/dev/null || echo "(test-results is empty or missing)"

      - name: Print failure details
        if: failure()
        run: |
          echo "=== dotnet test output above ==="
          if [ -f test-results/e2e-results.trx ]; then
            echo "=== Full TRX ==="
            cat test-results/e2e-results.trx
          else
            echo "No TRX file found in test-results/"
          fi

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-videos-${{ github.run_id }}
          path: test-results/videos/
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: test-results/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-trx-${{ github.run_id }}
          path: test-results/e2e-results.trx
          if-no-files-found: warn

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}
          path: test-results/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Extract TRX failures for PR comment
        if: failure() && github.event_name == 'pull_request'
        id: trx
        run: |
          TRX=test-results/e2e-results.trx
          if [ -f "$TRX" ]; then
            NAMES=$(grep -o 'testName="[^"]*"[^>]*outcome="Failed"' "$TRX" \
              | sed 's/testName="//;s/" .*//' | tr '\n' '|')
            MSGS=$(grep -A5 'outcome="Failed"' "$TRX" \
              | grep '<Message>' \
              | sed 's|.*<Message>||;s|</Message>.*||;s|^ *||' \
              | head -8 | tr '\n' '~')
            echo "names=${NAMES}" >> "$GITHUB_OUTPUT"
            echo "msgs=${MSGS}"   >> "$GITHUB_OUTPUT"
          else
            echo "names=(no TRX)" >> "$GITHUB_OUTPUT"
            echo "msgs="          >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    name: Publish E2E videos to GitHub Pages
    needs: e2e
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialise gh-pages pushes with the parallel storyboard publisher (both write the
    # same runs/{id}/ tree and root table). cancel-in-progress: false → they queue.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout source (for the page generator)
        uses: actions/checkout@v7

      - name: Download E2E videos artifact
        # Infra failures before Playwright runs leave no artifact; we still want
        # to publish a run page with failure metadata, so don't fail the job.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-videos-${{ github.run_id }}
          path: videos

      - name: Prepare gh-pages working tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --branch gh-pages --single-branch "$REMOTE" gh-pages 2>/dev/null; then
            echo "Cloned existing gh-pages branch."
          else
            echo "gh-pages branch not found — creating an orphan branch."
            git clone --quiet "$REMOTE" gh-pages
            git -C gh-pages checkout --orphan gh-pages
            git -C gh-pages rm -rf --quiet . 2>/dev/null || true
          fi
          git -C gh-pages config user.name  "github-actions[bot]"
          git -C gh-pages config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate pages
        env:
          PAGES_DIR: ${{ github.workspace }}/gh-pages
          VIDEOS_DIR: ${{ github.workspace }}/videos
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS: ${{ needs.e2e.result }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/generate-pages.sh

      - name: Commit and push to gh-pages (single-commit history)
        working-directory: gh-pages
        # Re-root gh-pages to ONE orphan commit each publish so the large .webm video
        # blobs never accumulate in branch history (they're also kept as run artifacts,
        # and the generator already prunes old run *files*). The shared
        # `gh-pages-publish` concurrency group serialises this with the storyboard
        # publisher, and both clone the latest gh-pages first, so collapsing to a single
        # commit preserves both publishers' run directories + the root table.
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git checkout --orphan publish-root
          git add -A
          git commit --quiet -m "ci: publish e2e videos for run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git push --force origin publish-root:gh-pages; then
              echo "Published (history squashed) on attempt $attempt."
              exit 0
            fi
            echo "Force-push failed (attempt $attempt) — retrying."
            sleep 5
          done
          echo "Failed to push after retries." >&2
          exit 1

      - name: Upsert PR comment with GitHub Pages link
        uses: actions/github-script@v9
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          FAIL_NAMES: ${{ needs.e2e.outputs.fail_names }}
          FAIL_MSGS:  ${{ needs.e2e.outputs.fail_msgs }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const runId = context.runId;
            const result  = process.env.E2E_RESULT || 'unknown';
            const outcome = result === 'success' ? '✅ passed' : '❌ failed';
            const names = (process.env.FAIL_NAMES || '').trim();
            const msgs  = (process.env.FAIL_MSGS  || '').trim();
            const failSection = (names && names !== '(no TRX)')
              ? `\n**Failed:** ${names}\n**Errors:** ${msgs}\n`
              : '';

            const pagesRun  = `https://${owner}.github.io/${repo}/runs/${runId}/`;
            const pagesRoot = `https://${owner}.github.io/${repo}/`;
            const actionsRun = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const marker = '<!-- e2e-video-report -->';
            const body = [
              marker,
              `## E2E Happy-Path ${outcome}`,
              '',
              `▶️ **[Watch the recordings inline](${pagesRun})** — plays in your browser, no download needed.`,
              '',
              `[All runs](${pagesRoot}) · [Actions run](${actionsRun})`,
              failSection,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body,
              });
            }
