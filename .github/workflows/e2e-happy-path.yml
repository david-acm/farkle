name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Farkle.sln

      - name: Build
        run: dotnet build Farkle.sln --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/Farkle.Tests/Farkle.Tests.csproj
          --no-build
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory test-results

      - name: Integration tests
        run: >
          dotnet test tests/Farkle.WebTests/Farkle.WebTests.csproj
          --no-build
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory test-results

      - name: SPA component tests
        run: >
          dotnet test tests/Farkle.SpaTests/Farkle.SpaTests.csproj
          --no-build
          --logger "trx;LogFileName=spa-results.trx"
          --results-directory test-results

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-trx-${{ github.run_id }}
          path: test-results/*.trx
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore tests/Farkle.E2eTests/Farkle.E2eTests.csproj

      - name: Clean
        run: dotnet clean tests/Farkle.E2eTests/Farkle.E2eTests.csproj

      - name: Build
        run: dotnet build tests/Farkle.E2eTests/Farkle.E2eTests.csproj --no-restore

      - name: Install Playwright Chromium
        # Use the playwright.ps1 bundled with the build output — it matches the exact
        # Microsoft.Playwright NuGet version so browsers are installed to the right path.
        run: pwsh tests/Farkle.E2eTests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run happy-path e2e tests
        run: >
          dotnet test tests/Farkle.E2eTests/Farkle.E2eTests.csproj
          --no-build
          --filter "FullyQualifiedName~GameHappyPath"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory test-results

      - name: Print failure details
        if: failure()
        run: |
          echo "=== dotnet test output above ==="
          if [ -f test-results/e2e-results.trx ]; then
            echo "=== Full TRX ==="
            cat test-results/e2e-results.trx
          else
            echo "No TRX file found in test-results/"
            ls -la test-results/ 2>/dev/null || true
          fi

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-${{ github.run_id }}
          path: test-results/videos/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trx-${{ github.run_id }}
          path: test-results/e2e-results.trx
          if-no-files-found: warn

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: test-results/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Extract TRX failures for PR comment
        if: failure() && github.event_name == 'pull_request'
        id: trx
        run: |
          TRX=test-results/e2e-results.trx
          if [ -f "$TRX" ]; then
            NAMES=$(grep -o 'testName="[^"]*"[^>]*outcome="Failed"' "$TRX" \
              | sed 's/testName="//;s/" .*//' | tr '\n' '|')
            MSGS=$(grep -A5 'outcome="Failed"' "$TRX" \
              | grep '<Message>' \
              | sed 's|.*<Message>||;s|</Message>.*||;s|^ *||' \
              | head -8 | tr '\n' '~')
            echo "names=${NAMES}" >> "$GITHUB_OUTPUT"
            echo "msgs=${MSGS}"   >> "$GITHUB_OUTPUT"
          else
            echo "names=(no TRX)" >> "$GITHUB_OUTPUT"
            echo "msgs="          >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR with video links
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome = '${{ job.status }}' === 'success' ? '✅ passed' : '❌ failed';
            const names = `${{ steps.trx.outputs.names || '' }}`;
            const msgs  = `${{ steps.trx.outputs.msgs  || '' }}`;
            const failSection = names
              ? `\n**Failed tests:** ${names}\n**Errors:** ${msgs}\n`
              : '';
            const body = [
              `## E2E Happy-Path Tests ${outcome}`,
              '',
              `**Videos** (download from the run artifacts):`,
              `- [e2e-videos-${context.runId}](${runUrl}#artifacts)`,
              '',
              `| Recording | Description |`,
              `|-----------|-------------|`,
              `| \`ShowDiceAfterRolling.webm\` | Roll button clicked, dice appear |`,
              `| \`CanDragDieToSetAsideZone.webm\` | Die dragged from Rolled → SetAside zone |`,
              `| \`ScoreIncreasesAfterKeepingAScoringDie.webm\` | Full keep cycle, score updates |`,
              `| \`TurnScoreDisplayIsVisible.webm\` | Score heading visible after WASM hydration |`,
              `| \`PassTurnButtonResetsScore.webm\` | Pass Turn resets dice and turn score |`,
              failSection,
              `[View full run](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
