name: Ops - Infra Teardown
# Deletes the workload resource group via OIDC. Exposed as a reusable workflow so
# the scheduled lifecycle automation (infra-schedule.yml) and the budget cost-guard
# (infra-cost-guard.yml) can call it. Manual runs are also supported.
#
# Destructive: deletes the RG and everything in it (Postgres + EventStore data).
# No-ops until enabled: gated on the repository variable DEPLOY_ENABLED == 'true'.
# Azure config (AZURE_*) is read from the `production` environment.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: Delete resource group
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete resource group (idempotent)
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          if [ "$(az group exists --name "$rg")" = "true" ]; then
            az group delete --name "$rg" --yes
          else
            echo "Resource group '$rg' does not exist; nothing to delete."
          fi
