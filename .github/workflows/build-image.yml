name: CI - Image

# Builds the WebApp image and pushes it to the PERSISTENT ACR (private), then chains
# the fast CD - App Release of that exact image via `workflow_call` — build-once,
# deploy-many. App Release does only `az containerapp update` (no ARM), so this path
# is fast and cannot touch the database / networking. Topology/config changes go
# through CD - Infra Deploy (workload) on infra/** changes instead.
#
# Using `needs:`/`workflow_call` (not `workflow_run`) means the release runs in the
# same logical run, shares context, rolls the exact <sha> just built, and shows up
# under this run rather than detached on the default branch.
#
# The image survives the nightly RG teardown (the ACR is in the persistent RG), so
# the scheduled morning re-provision redeploys an existing image without rebuilding.
#
# Auto-deploy: no approval gate (so OIDC ids come from REPOSITORY variables, not the
# gated `production` environment). No-ops until enabled: gated on DEPLOY_ENABLED.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src/WebApp/Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & push WebApp image to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # No environment → no approval gate. Building/pushing an image is harmless (it
    # doesn't affect the running app); OIDC ids are read from repository variables.
    env:
      AZURE_PERSISTENT_RESOURCE_GROUP: ${{ vars.AZURE_PERSISTENT_RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push to persistent ACR
        run: |
          name=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].name' -o tsv)
          login=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].loginServer' -o tsv)
          if [ -z "$name" ]; then
            echo "::error::Persistent ACR not found in '$AZURE_PERSISTENT_RESOURCE_GROUP'. Deploy infra-persistent.yml first."
            exit 1
          fi
          az acr login --name "$name"
          docker build -t "${login}/webapp:${IMAGE_TAG}" -t "${login}/webapp:latest" -f src/WebApp/Dockerfile .
          docker push "${login}/webapp:${IMAGE_TAG}"
          docker push "${login}/webapp:latest"
          echo "### Image published: \`${login}/webapp:${IMAGE_TAG}\` (+ :latest)" >> "$GITHUB_STEP_SUMMARY"

  # CD: roll the live WebApp to the exact image just built (fast, no ARM, ungated).
  release:
    needs: build
    uses: ./.github/workflows/app-release.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
