name: CI - Image

# Builds the WebApp image and pushes it to the PERSISTENT ACR (private), then chains
# the fast CD - App Release of that exact image via `workflow_call` — build-once,
# deploy-many. App Release does only `az containerapp update` (no ARM), so this path
# is fast and cannot touch the database / networking. Topology/config changes go
# through CD - Infra Deploy (workload) on infra/** changes instead.
#
# Using `needs:`/`workflow_call` (not `workflow_run`) means the release runs in the
# same logical run, shares context, rolls the exact <sha> just built, and shows up
# under this run rather than detached on the default branch.
#
# The image survives the nightly RG teardown (the ACR is in the persistent RG), so
# the scheduled morning re-provision redeploys an existing image without rebuilding.
#
# Auto-deploy: no approval gate (so OIDC ids come from REPOSITORY variables, not the
# gated `production` environment). No-ops until enabled: gated on DEPLOY_ENABLED.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src/WebApp/Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & push WebApp image to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # No environment → no approval gate. Building/pushing an image is harmless (it
    # doesn't affect the running app); OIDC ids are read from repository variables.
    env:
      AZURE_PERSISTENT_RESOURCE_GROUP: ${{ vars.AZURE_PERSISTENT_RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # fetch-depth: 0 so MinVer sees the full history + tags (a shallow clone can't compute
      # the version). MinVer runs on the host — the image is built inside the SDK container
      # where .git is .dockerignore'd — and the result is passed in as build-args.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version (MinVer)
        run: |
          set -euo pipefail
          dotnet tool restore
          version=$(dotnet minver -t v 2>/dev/null)
          informational="${version}+$(git rev-parse --short=7 HEAD)"
          echo "VERSION=$version"             >> "$GITHUB_ENV"
          echo "INFORMATIONAL=$informational" >> "$GITHUB_ENV"
          echo "### Version: \`${informational}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          # Least-privilege app-release identity (AcrPush + container-app update only),
          # federated for ref:refs/heads/main — not the gated subscription-Owner SP.
          client-id: ${{ vars.AZURE_APP_RELEASE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push to persistent ACR
        run: |
          name=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].name' -o tsv)
          login=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].loginServer' -o tsv)
          if [ -z "$name" ]; then
            echo "::error::Persistent ACR not found in '$AZURE_PERSISTENT_RESOURCE_GROUP'. Deploy infra-persistent.yml first."
            exit 1
          fi
          az acr login --name "$name"
          # Stamp the assemblies with the MinVer version (build-args → /p:Version), and tag
          # the image with the semver (no '+metadata', invalid in a docker tag) alongside the
          # git SHA (+ latest). App Release still rolls the deterministic :<sha>.
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg INFORMATIONAL="$INFORMATIONAL" \
            -t "${login}/webapp:${IMAGE_TAG}" \
            -t "${login}/webapp:${VERSION}" \
            -t "${login}/webapp:latest" \
            -f src/WebApp/Dockerfile .
          docker push "${login}/webapp:${IMAGE_TAG}"
          docker push "${login}/webapp:${VERSION}"
          docker push "${login}/webapp:latest"
          echo "### Image published: \`${login}/webapp:${VERSION}\` (+ :${IMAGE_TAG}, :latest) — version \`${INFORMATIONAL}\`" >> "$GITHUB_STEP_SUMMARY"

  # CD: roll the live WebApp to the exact image just built (fast, no ARM, ungated).
  release:
    needs: build
    uses: ./.github/workflows/app-release.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
