name: CI - CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Monday at 08:00 UTC — catches new CVEs even without code changes
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # Fail the workflow on high or critical severity findings
          queries: security-and-quality
          # Excludes the generated Kiota client from analysis (see the config).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Restore
        run: dotnet restore Farkle.sln

      - name: Build
        run: dotnet build Farkle.sln --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
