name: Mobile — iOS build

# Reusable (workflow_call) build of the HotDice MAUI Blazor Hybrid shell for iOS — the GitHub
# translation of the reference app's ios-build.yml ADO template (#338). Produces a signed .ipa named
# by the monotonic version, uploaded as a workflow artifact (the input to CD, #340).
#
# Runs on macOS (Xcode is required for the iOS SDK); this repo is public, so GitHub's macOS runners
# are free — hence iOS builds run post-merge rather than being pushed to a nightly cron as the
# reference app had to. Signing material never lives in the repo: the distribution .p12 and the
# provisioning profile are base64 GitHub secrets imported into a *temporary* keychain at build time
# and torn down after (docs/mobile-signing-secrets.md). Until the secrets are configured the job
# still runs and does an UNSIGNED simulator build with a warning, so the build gate is proven before
# the Apple credentials exist.

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration.'
        type: string
        default: Release
      xcode-version:
        description: >
          Xcode version to pin on the runner (e.g. 16.2). Empty (default) uses the runner's default
          Xcode, which GitHub keeps at a recent MAUI-supported stable — the robust choice, since the
          exact versions installed on macos-latest drift. A pin is honoured only if that Xcode is
          actually present (setup-maui warns and falls back otherwise).
        type: string
        default: ''
    secrets:
      IOS_DIST_CERT_P12_BASE64:
        description: 'Base64 of the Apple Distribution certificate (.p12). Absent → unsigned simulator build.'
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        description: 'Base64 of the App Store provisioning profile (.mobileprovision).'
        required: false

permissions:
  contents: read

jobs:
  ios:
    name: Build shell (.ipa)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup MAUI toolchain
        uses: ./.github/actions/setup-maui
        with:
          workload: ios
          xcode-version: ${{ inputs.xcode-version }}

      - name: Compute version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: bash .github/scripts/mobile-version.sh

      - name: Import signing material into a temp keychain
        id: signing
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "::warning title=Unsigned build::iOS signing secrets are not set — building UNSIGNED for the simulator. Configure IOS_DIST_CERT_P12_BASE64 + IOS_PROVISIONING_PROFILE_BASE64 (docs/mobile-signing-secrets.md) for a store-ready .ipa."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Install the provisioning profile where Xcode looks for it.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          rm -f "$RUNNER_TEMP/dist.p12"
          {
            echo "signed=true"
            echo "profile_name=$name"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"

      - name: Publish signed .ipa
        if: steps.signing.outputs.signed == 'true'
        run: >
          dotnet publish src/HotDice.Shell/HotDice.Shell.csproj
          -f net10.0-ios -c ${{ inputs.configuration }}
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:ApplicationVersion=${{ steps.version.outputs.version_code }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.display_version }}
          -p:CodesignKey="${{ steps.signing.outputs.identity }}"
          -p:CodesignProvision="${{ steps.signing.outputs.profile_name }}"

      - name: Build unsigned (simulator)
        if: steps.signing.outputs.signed == 'false'
        run: >
          dotnet build src/HotDice.Shell/HotDice.Shell.csproj
          -f net10.0-ios -c ${{ inputs.configuration }}
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Tear down the temp keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true

      - name: Collect the .ipa
        id: collect
        if: steps.signing.outputs.signed == 'true'
        run: |
          ipa="$(find src/HotDice.Shell/bin -name '*.ipa' -print -quit)"
          [ -n "$ipa" ] || { echo "::error::no .ipa produced"; exit 1; }
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hotdice-ios-${{ steps.version.outputs.build_version }}
          path: ${{ steps.collect.outputs.path }}
          retention-days: 14
          if-no-files-found: error
