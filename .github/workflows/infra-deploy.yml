name: Infra Deploy (workload)

# Deploys the disposable workload (Postgres + EventStore + Container Apps env +
# WebApp + budget) to Azure via OIDC. The WebApp image is built and pushed to the
# PERSISTENT ACR separately by CI (build-image.yml) — this workflow only *deploys*
# it (build-once, deploy-many). The persistent ACR / Key Vault / identity are
# resolved from the persistent resource group and passed into the deploy.
#
# image_tag defaults to `latest` (the most recent image CI published); pass a
# specific git SHA to roll back to an exact build.
#
# Also a reusable workflow so CI and the scheduled lifecycle automation can call it.
# No-ops until enabled: gated on the repository variable DEPLOY_ENABLED == 'true'.
# Azure config (AZURE_*) + secrets are read from the `production` environment.
on:
  push:
    branches: [main]
    paths:
      - 'infra/main.bicep'
      - 'infra/modules/workload.bicep'
      - 'infra/env/dev.bicepparam'
      - 'infra/env/prod.bicepparam'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        type: string
        default: 'latest'

permissions:
  id-token: write
  contents: read

# Serialise deploys so a CI-triggered deploy and an infra push don't race on the RG.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy workload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_PERSISTENT_RESOURCE_GROUP: ${{ vars.AZURE_PERSISTENT_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve persistent stack references
        id: persistent
        run: |
          acr=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].loginServer' -o tsv)
          kv=$(az keyvault list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].properties.vaultUri' -o tsv)
          mi=$(az identity list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].id' -o tsv)
          if [ -z "$acr" ] || [ -z "$kv" ] || [ -z "$mi" ]; then
            echo "::error::Persistent stack not found in '$AZURE_PERSISTENT_RESOURCE_GROUP'. Deploy infra-persistent.yml first."
            exit 1
          fi
          echo "acr=$acr" >> "$GITHUB_OUTPUT"
          echo "kv=$kv"   >> "$GITHUB_OUTPUT"
          echo "mi=$mi"   >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        # The .bicepparam reads PG_ADMIN_PASSWORD / IMAGE_TAG / AZURE_RESOURCE_GROUP /
        # ACR_LOGIN_SERVER / KEY_VAULT_URI / IDENTITY_RESOURCE_ID from the environment.
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          ACR_LOGIN_SERVER: ${{ steps.persistent.outputs.acr }}
          KEY_VAULT_URI: ${{ steps.persistent.outputs.kv }}
          IDENTITY_RESOURCE_ID: ${{ steps.persistent.outputs.mi }}
        run: |
          az bicep install
          fqdn=$(az deployment sub create \
            --name "farkle-workload-${IMAGE_TAG}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/env/dev.bicepparam \
            --query 'properties.outputs.webAppFqdn.value' -o tsv)
          echo "### WebApp deployed: https://${fqdn} (image tag \`${IMAGE_TAG}\`)" >> "$GITHUB_STEP_SUMMARY"
