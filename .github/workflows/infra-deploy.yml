name: CD - Infra Deploy (workload)
# Full-stack workload deploy (Postgres + EventStore + Container Apps env + WebApp +
# budget) via ARM/OIDC. Runs for INFRA changes (infra/** paths) and the scheduled
# morning re-provision (infra-schedule.yml) — NOT for everyday image rolls, which go
# through the fast CD - App Release (app-release.yml). Stays gated on `production`.
#
# The WebApp image is built and pushed to the PERSISTENT ACR separately by CI
# (build-image.yml) — this workflow only *deploys* it (build-once, deploy-many). The
# persistent ACR / Key Vault / identity are resolved from the persistent RG.
#
# image_tag defaults to `latest` (the most recent image CI published); pass a
# specific git SHA to roll back to an exact build.
#
# Also a reusable workflow so CI and the scheduled lifecycle automation can call it.
# No-ops until enabled: gated on the repository variable DEPLOY_ENABLED == 'true'.
# Azure config (AZURE_*) + secrets are read from the `production` environment.
on:
  push:
    branches: [main]
    paths:
      - 'infra/main.bicep'
      - 'infra/modules/workload.bicep'
      - 'infra/env/dev.bicepparam'
      - 'infra/env/prod.bicepparam'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        type: string
        default: 'latest'

permissions:
  id-token: write
  contents: read

# Serialise deploys (shared with app-release) so a workload deploy and an app-image roll
# never race on the RG. Renamed from "cd-deploy" after that group wedged on GitHub's side.
concurrency:
  group: workload-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy workload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_PERSISTENT_RESOURCE_GROUP: ${{ vars.AZURE_PERSISTENT_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus' }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate required configuration
        # Fail fast with a clear message instead of a cryptic Bicep "name property
        # cannot be null or empty" — readEnvironmentVariable() returns the empty
        # string (not the param default) when the variable is set-but-empty, which
        # is what an undefined `vars.*` expands to.
        run: |
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP variable (the disposable RG) in repo/environment settings}"
          : "${AZURE_PERSISTENT_RESOURCE_GROUP:?Set the AZURE_PERSISTENT_RESOURCE_GROUP variable (e.g. rg-hotdice-eus2-shared) in repo/environment settings}"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve persistent stack references
        id: persistent
        run: |
          rg="$AZURE_PERSISTENT_RESOURCE_GROUP"
          acr=$(az acr list -g "$rg" --query '[0].loginServer' -o tsv)
          kv=$(az keyvault list -g "$rg" --query '[0].properties.vaultUri' -o tsv)
          mi=$(az identity list -g "$rg" --query '[0].id' -o tsv)
          mi_principal=$(az identity list -g "$rg" --query '[0].principalId' -o tsv)
          mi_client=$(az identity list -g "$rg" --query '[0].clientId' -o tsv)
          mi_name=$(az identity list -g "$rg" --query '[0].name' -o tsv)
          if [ -z "$acr" ] || [ -z "$kv" ] || [ -z "$mi" ] || [ -z "$mi_principal" ] || [ -z "$mi_name" ]; then
            echo "::error::Persistent stack not found in '$AZURE_PERSISTENT_RESOURCE_GROUP'. Deploy infra-persistent.yml first."
            exit 1
          fi
          echo "acr=$acr"                >> "$GITHUB_OUTPUT"
          echo "kv=$kv"                  >> "$GITHUB_OUTPUT"
          echo "mi=$mi"                  >> "$GITHUB_OUTPUT"
          echo "mi_principal=$mi_principal" >> "$GITHUB_OUTPUT"
          echo "mi_client=$mi_client"    >> "$GITHUB_OUTPUT"
          echo "mi_name=$mi_name"        >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        # The .bicepparam reads PG_ADMIN_PASSWORD / IMAGE_TAG / AZURE_RESOURCE_GROUP /
        # ACR_LOGIN_SERVER / KEY_VAULT_URI / IDENTITY_* from the environment.
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          ACR_LOGIN_SERVER: ${{ steps.persistent.outputs.acr }}
          KEY_VAULT_URI: ${{ steps.persistent.outputs.kv }}
          IDENTITY_RESOURCE_ID: ${{ steps.persistent.outputs.mi }}
          IDENTITY_PRINCIPAL_ID: ${{ steps.persistent.outputs.mi_principal }}
          IDENTITY_CLIENT_ID: ${{ steps.persistent.outputs.mi_client }}
          IDENTITY_NAME: ${{ steps.persistent.outputs.mi_name }}
        run: |
          az bicep install
          fqdn=$(az deployment sub create \
            --name "hotdice-workload-${{ github.run_id }}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/env/dev.bicepparam \
            --query 'properties.outputs.webAppFqdn.value' -o tsv)
          echo "### WebApp deployed: https://${fqdn} (image tag \`${IMAGE_TAG}\`)" >> "$GITHUB_STEP_SUMMARY"
