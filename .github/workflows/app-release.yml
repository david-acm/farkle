name: CD - App Release

# Fast app-version roll: points the already-provisioned WebApp container app at a
# newly built image via `az containerapp update` (seconds, tiny blast radius). This
# is the everyday deploy for src/** changes — it does NOT run ARM, so it cannot touch
# Postgres / EventStore / networking. Full-stack changes go through CD - Infra Deploy
# (workload) instead.
#
# Ungated by design (auto-deploy on push, gated only by DEPLOY_ENABLED). It reads the
# OIDC identifiers from REPOSITORY variables (not the gated `production` environment),
# so it needs no manual approval. Rolling back = re-run with a prior image_tag (SHA).
#
# Assumes the workload is already provisioned. If the disposable RG was torn down for
# cost-saving, it skips cleanly — the image is in ACR (:<sha> + :latest) and the next
# Ops - Infra Schedule provision picks it up.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll to (a git SHA, or latest)'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to roll to (a git SHA, or latest)'
        required: false
        type: string
        default: 'latest'

permissions:
  id-token: write
  contents: read

# Share the CD lock with infra-deploy so an app release never races a full infra deploy.
# (Renamed from "cd-deploy": that group got wedged on GitHub's side when two CI - Image
# runs raced it and one was cancelled mid-queue, after which it stopped dispatching.)
concurrency:
  group: workload-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Roll WebApp image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    outputs:
      # The deployed app URL (empty when the workload isn't provisioned → post-deploy smoke skips).
      fqdn: ${{ steps.roll.outputs.fqdn }}
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_PERSISTENT_RESOURCE_GROUP: ${{ vars.AZURE_PERSISTENT_RESOURCE_GROUP }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

    steps:
      - name: Validate required configuration
        run: |
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP variable (the disposable RG) in repo settings}"
          : "${AZURE_PERSISTENT_RESOURCE_GROUP:?Set the AZURE_PERSISTENT_RESOURCE_GROUP variable (e.g. rg-hotdice-eus2-shared) in repo settings}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          # Least-privilege app-release identity (AcrPush + container-app update only),
          # federated for ref:refs/heads/main — not the gated subscription-Owner SP.
          client-id: ${{ vars.AZURE_APP_RELEASE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the WebApp container to the new image
        id: roll
        run: |
          set -euo pipefail

          # Resolve the persistent ACR (image source) and the live WebApp container app.
          acr=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].loginServer' -o tsv)
          acrName=$(az acr list -g "$AZURE_PERSISTENT_RESOURCE_GROUP" --query '[0].name' -o tsv)
          if [ -z "$acr" ] || [ -z "$acrName" ]; then
            echo "::error::Persistent ACR not found in '$AZURE_PERSISTENT_RESOURCE_GROUP'. Deploy infra-persistent.yml first."
            exit 1
          fi

          # Validate the requested tag exists in ACR before rolling — a manual dispatch with a
          # short SHA (e.g. 7cca761) points at a tag that was never pushed (the build tags the
          # full SHA + :latest), which otherwise produces a slow, easy-to-miss ImagePullBackOff
          # while the old revision keeps serving (#154). If the exact tag is missing, try to
          # resolve it as a unique prefix of a real tag (short SHA -> full SHA); else fail fast.
          if ! az acr repository show --name "$acrName" --image "webapp:${IMAGE_TAG}" --output none 2>/dev/null; then
            mapfile -t matches < <(az acr repository show-tags --name "$acrName" --repository webapp -o tsv 2>/dev/null \
              | grep -E "^${IMAGE_TAG}" || true)
            if [ "${#matches[@]}" -eq 1 ]; then
              echo "::notice::Resolved image tag '${IMAGE_TAG}' -> '${matches[0]}'."
              IMAGE_TAG="${matches[0]}"
            elif [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::No image 'webapp:${IMAGE_TAG}' in ACR '${acrName}', and no tag starts with it. Recent tags:"
              az acr repository show-tags --name "$acrName" --repository webapp --orderby time_desc --top 10 -o tsv || true
              exit 1
            else
              echo "::error::Ambiguous tag prefix '${IMAGE_TAG}' matches ${#matches[@]} tags: ${matches[*]}"
              exit 1
            fi
          fi

          app=$(az containerapp list -g "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(name,'web')].name | [0]" -o tsv 2>/dev/null || true)
          if [ -z "$app" ]; then
            echo "::notice::Workload not provisioned in '$AZURE_RESOURCE_GROUP' — nothing to roll. The image is in ACR as ${acr}/webapp:${IMAGE_TAG} (+ :latest) and will be picked up on the next provision."
            echo "### Skipped: workload not provisioned. Image \`${acr}/webapp:${IMAGE_TAG}\` is in ACR; next provision will deploy it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Unique revision suffix → a fresh single-active revision that re-pulls the image.
          short="${IMAGE_TAG:0:7}"
          suffix="r${short}-${{ github.run_id }}"

          az containerapp update \
            --name "$app" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${acr}/webapp:${IMAGE_TAG}" \
            --revision-suffix "$suffix" \
            --output none

          fqdn=$(az containerapp show -n "$app" -g "$AZURE_RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "### WebApp rolled: https://${fqdn} → image tag \`${IMAGE_TAG}\` (revision \`${suffix}\`)" >> "$GITHUB_STEP_SUMMARY"
          # Hand the deployed URL to the post-deploy smoke job (#231).
          echo "fqdn=https://${fqdn}" >> "$GITHUB_OUTPUT"

  # #231 — after the roll, run the Playwright happy-path against the *deployed* app as a
  # post-deployment smoke test (no Testcontainers — E2E_BASE_URL points Playwright at the live
  # URL), then emit a link to inspect this run's telemetry in Application Insights. Report-only:
  # a failure surfaces the recordings + flags the run, but does not auto-roll back.
  post-deploy-e2e:
    name: Post-deploy E2E smoke (deployed env)
    needs: release
    # Skip cleanly when the workload wasn't provisioned (release produced no FQDN).
    if: ${{ needs.release.outputs.fqdn != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ needs.release.outputs.fqdn }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore tests/Farkle.E2eTests/Farkle.E2eTests.csproj

      - name: Build
        run: dotnet build tests/Farkle.E2eTests/Farkle.E2eTests.csproj --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/Farkle.E2eTests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Wait for the deployment to be ready
        # #235 — the roll just bumped the revision; its EventStore dependency can still be
        # reconnecting (a real run saw "Connection refused (esdb:2113)" seconds post-deploy).
        # /health/ready includes the EventStoreHealthCheck (tagged "ready"), so it goes 200 only
        # once web AND ESDB are live. Poll it before driving the smoke so we don't test a
        # half-ready app. Fail fast (with a clear message) if it never settles.
        run: |
          set -uo pipefail
          deadline=$(( $(date -u +%s) + 240 ))
          until curl -fsS -o /dev/null "${BASE_URL}/health/ready"; do
            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error::Deployment not ready (${BASE_URL}/health/ready) after 240s — aborting smoke."
              exit 1
            fi
            echo "Not ready yet; retrying in 5s..."
            sleep 5
          done
          echo "Deployment is ready."

      - name: Record smoke window start
        id: t0
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Run happy-path smoke against the deployed app
        # E2E_BASE_URL → drive the remote deployment (no in-process host / Testcontainers).
        # E2E_STEP_DELAY_MS=0 → no video-pacing holds, run at full speed.
        env:
          E2E_BASE_URL: ${{ needs.release.outputs.fqdn }}
          E2E_STEP_DELAY_MS: '0'
        run: >
          dotnet test tests/Farkle.E2eTests/Farkle.E2eTests.csproj
          --no-build
          --filter "FullyQualifiedName~GameHappyPathShould.HappyPath"
          --logger "trx;LogFileName=post-deploy-e2e.trx"
          --results-directory test-results

      - name: Record smoke window end
        if: always()
        id: t1
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_APP_RELEASE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: App Insights telemetry link for this run
        # Never fail the deploy over telemetry: the live query needs Monitoring Reader, which the
        # least-privilege app-release identity may lack. The Logs deep link + KQL text always work.
        if: always()
        continue-on-error: true
        env:
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          START_EPOCH: ${{ steps.t0.outputs.epoch }}
          END_EPOCH: ${{ steps.t1.outputs.epoch }}
        run: |
          set -uo pipefail
          # Pad the window for ingestion latency (telemetry lands minutes after the action).
          start=$(date -u -d "@$((START_EPOCH-120))" +%Y-%m-%dT%H:%M:%S.000Z)
          stop=$(date -u -d "@$((END_EPOCH+300))" +%Y-%m-%dT%H:%M:%S.000Z)

          # #235 — resolve the App Insights component via `az monitor app-insights` (which the
          # deploy identity CAN read), NOT `az resource list` (the generic resource-list returns
          # empty under this least-privilege RBAC, so the old call silently produced no deep link).
          az extension add -n application-insights -y >/dev/null 2>&1 || true
          ai_id=$(az monitor app-insights component show -g "$AZURE_RESOURCE_GROUP" \
            --query "[0].id" -o tsv 2>/dev/null || true)

          KQL=$'union requests, pageViews, customEvents, exceptions, dependencies\n| order by timestamp desc\n| project timestamp, itemType, name, operation_Id, client_Type, cloud_RoleName'

          {
            echo "## Post-deploy telemetry (App Insights)"
            echo ""
            echo "- Deployed app: ${BASE_URL}"
            echo "- Window (UTC, padded for ingestion): \`${start}\` → \`${stop}\`"
            echo ""
            echo '```kusto'
            echo "$KQL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ai_id" ]; then
            enc_id=$(printf '%s' "$ai_id" | jq -sRr @uri)
            enc_q=$(printf '%s' "$KQL" | gzip -c | base64 -w0 | jq -sRr @uri)
            link="https://portal.azure.com#@${TENANT_ID}/blade/Microsoft_Azure_Monitoring_Logs/LogsBlade/resourceId/${enc_id}/source/LogsBlade.AnalyticsShareLinkToQuery/q/${enc_q}/timespan/${start}%2F${stop}"
            {
              echo ""
              echo "▶️ **[Open this run's telemetry in App Insights Logs](${link})**"
            } >> "$GITHUB_STEP_SUMMARY"

            # Best-effort live counts — needs Monitoring Reader; never fails the job.
            app_id=$(az monitor app-insights component show --ids "$ai_id" --query appId -o tsv 2>/dev/null || true)
            if [ -n "$app_id" ]; then
              {
                echo ""
                echo "### Live counts (best-effort)"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # Use -o tsv: `-o table` silently drops single-result rows from the AI query API.
              az monitor app-insights query --apps "$app_id" \
                --analytics-query "union requests, pageViews, customEvents, exceptions | where timestamp between (datetime(${start}) .. datetime(${stop})) | summarize count() by itemType" \
                -o tsv >> "$GITHUB_STEP_SUMMARY" 2>&1 \
                || echo "(query unavailable — identity likely lacks Monitoring Reader)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo ""
              echo "_App Insights resource not resolvable with the deploy identity — paste the query above into the Logs blade and set the time range manually._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # #231 — the post-deploy smoke publishes NO video (it runs at delay 0, so a recording would
      # be a useless blur; failures are diagnosed from the TRX + the App Insights telemetry link
      # above). Video publishing stays on the PR CI e2e run only.
      - name: Upload smoke TRX
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-e2e-trx-${{ github.run_id }}
          path: test-results/post-deploy-e2e.trx
          if-no-files-found: warn

      - name: Upload smoke logs (failure only)
        # #235 — on failure the test writes the captured browser console + API logs to
        # test-results/logs/. Publishing these (no video) makes a failed smoke debuggable from
        # the run alone, instead of having to reproduce locally against the deployed URL.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-e2e-logs-${{ github.run_id }}
          path: test-results/logs/
          if-no-files-found: warn
          retention-days: 14
