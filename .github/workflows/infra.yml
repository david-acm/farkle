name: CI - Infra What-If
# On-demand preview of what a deploy would change, via OIDC. Runs as a manual
# dispatch (not on PRs) because it needs the `production` environment to read the
# Azure config, and PR head branches generally can't enter a protected environment.
# PR-time Bicep checking is covered credential-free by infra-validate.yml.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    name: Deployment what-if
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment sub what-if
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az bicep install
          {
            echo '## Infra what-if'
            echo '```'
            az deployment sub what-if \
              --location "$AZURE_LOCATION" \
              --template-file infra/main.bicep \
              --parameters infra/env/dev.bicepparam 2>&1 | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
