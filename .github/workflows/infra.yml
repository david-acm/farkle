name: Infra What-If

# On PRs that touch infra/, runs `az deployment sub what-if` via OIDC and posts the
# predicted changes as a PR comment. No-ops (job skipped) until OIDC is configured.
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  what-if:
    name: Deployment what-if
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment sub what-if
        id: whatif
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az bicep install
          az deployment sub what-if \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/env/dev.bicepparam \
            > whatif.txt 2>&1 || true
          # Keep the comment within GitHub's size limit.
          head -c 60000 whatif.txt > whatif.trunc.txt

      - name: Upsert what-if PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              '<!-- infra-whatif-report -->',
              '## Infra what-if',
              '',
              '```',
              fs.readFileSync('whatif.trunc.txt', 'utf8').slice(0, 60000),
              '```',
            ].join('\n');
            const marker = '<!-- infra-whatif-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
